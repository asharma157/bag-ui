name: CI

# Runs on every push and PR. Needs no GCP access at all, so it goes green
# before any of the cloud setup exists.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` fails if package.json and package-lock.json have drifted,
      # which is the point of committing the lockfile.
      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check src/routing-context.js
          node --check public/app.js

      - name: Smoke test
        run: |
          APP_VERSION=ci-check PORT=8080 node server.js &
          for i in $(seq 1 20); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8080/health | tee /dev/stderr | grep -q '"version":"ci-check"'
          curl -sf -D- -o/dev/null localhost:8080/health | grep -qi 'x-bag-ui-version: ci-check'
